<div class="container-header">
    <header class="header-shell">
        <a class="brand" routerLink="/" aria-label="Recipe Box home">
            <img class="brand-logo" src="recipe-box-logo.svg" alt="Recipe Box">
        </a>

        <form class="search" role="search" (submit)="preventSubmit($event)">
            <span class="material-symbols-outlined search-icon" aria-hidden="true">search</span>
            <input
                type="search"
                [value]="recipeService.searchTerm()"
                (input)="onSearchInput($event)"
                placeholder="Search 15,000+ delicious recipes..."
                aria-label="Search recipes"
            >
            <button type="submit">Search</button>
        </form>

        <div class="actions" aria-label="User actions">
            <button type="button" class="icon-button" aria-label="Open favorites">
                <span class="material-symbols-outlined" aria-hidden="true">favorite</span>
            </button>

            <button type="button" class="profile" aria-label="Open profile menu">
                <span class="avatar" aria-hidden="true">SM</span>
                <span class="profile-name">Sarah M.</span>
                <span class="material-symbols-outlined" aria-hidden="true">keyboard_arrow_down</span>
            </button>
        </div>
    </header>
</div>
